# Sources per topic. Edit freely — add/remove feeds and the agent will pick them up.
# `type` is one of: rss, hn_algolia (Hacker News top stories via Algolia).
# `weight` (0.0-2.0) biases how many stories from this source survive curation.

topics:

  tech_ai_pm:
    label: "Tech, AI & Product"
    sources:
      - name: "Hacker News (top)"
        type: hn_algolia
        url: "https://hn.algolia.com/api/v1/search?tags=front_page"
        weight: 1.0
      - name: "Stratechery"
        type: rss
        url: "https://stratechery.com/feed/"
        weight: 1.5
      - name: "Lenny's Newsletter"
        type: rss
        url: "https://www.lennysnewsletter.com/feed"
        weight: 1.3
      - name: "Simon Willison"
        type: rss
        url: "https://simonwillison.net/atom/everything/"
        weight: 1.3
      - name: "NYT — Technology"
        type: rss
        url: "https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml"
        weight: 1.0

  arsenal_football:
    label: "Arsenal, Champions League & World Cup"
